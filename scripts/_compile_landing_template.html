<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>compile test</title></head>
<body>
<script src="../public/assets/vendor/vue/vue.global.prod.js"></script>
<script>
fetch('_landing_template.html').then(r => r.text()).then(tpl => {
  try {
    const { compile } = Vue;
    compile(tpl);
    document.body.textContent = 'OK';
  } catch (e) {
    document.body.textContent = e.message + '\n' + (e.stack || '');
  }
});
</script>
</body>
</html>
